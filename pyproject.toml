[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "albion-create-image-build"
dynamic = ["version"]
description = "Images PNG de builds et de compos Albion Online : disposition de l'inventaire du jeu, icônes officielles, thème et langue configurables."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "src/albion_create_image_build/assets/fonts/OFL.txt"]
keywords = ["albion-online", "albion", "build", "image", "pillow", "discord"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[project.urls]
Source = "https://github.com/NicolasDebras/AlbionCreateImageBuild"

[tool.hatch.version]
path = "src/albion_create_image_build/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/albion_create_image_build"]   # assets/ (police + icônes) inclus : ils sont dans le paquet

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["albion_create_image_build"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007"]   # Union[...] gardé dans un alias évalué à l'exécution
